name: 📚 Update documentation

on:
  workflow_dispatch:  # Manual trigger
  push:
    branches: [ master ]
    paths:
      - '**.ps1'
      - 'org/**'
      - 'user/**'
      - 'device/**'
      - 'group/**'
      - '.permissions/**'

permissions:
  contents: read  # checkout only; the push uses the GitHub App token, not GITHUB_TOKEN

# Never run two updates at once; queue instead of cancelling so an in-flight push is not interrupted
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  ROOT_PATH: ${{ github.workspace }}
  OUTPUT_PATH_DOCS: ${{ github.workspace }}/docs
  OUTPUT_PATH_GENERAL: ${{ github.workspace }}/docs/general
  OUTPUT_PATH_LISTS: ${{ github.workspace }}/docs/lists
  OUTPUT_PATH_OTHER: ${{ github.workspace }}/docs/other
  OUTPUT_PATH_JSON: ${{ github.workspace }}/docs/other/json
  PERMISSIONS_PATH: ${{ github.workspace }}/.permissions

jobs:
  update-docs:
    name: 🔄 Update runbook documentation
    runs-on: ubuntu-latest
    # Dedicated environment scoping the GitHub App credentials to master
    environment: runbook-docs

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 📁 Create output directories
        shell: pwsh
        run: |
          Write-Host "🔍 Cleaning docs directory (except /docs/general/, /docs/exports/ and README.md)..."
          if (Test-Path $env:OUTPUT_PATH_DOCS) {
            # Remove all items except 'general' folder, 'exports' folder (written by realmjoin/realmjoin-docs) and README.md
            Get-ChildItem -Path $env:OUTPUT_PATH_DOCS | Where-Object {
              $_.Name -ne 'general' -and $_.Name -ne 'exports' -and $_.Name -ne 'README.md'
            } | Remove-Item -Recurse -Force
          }
          
          Write-Host "🔍 Creating output directories..."
          New-Item -Path $env:OUTPUT_PATH_LISTS -ItemType Directory -Force
          New-Item -Path (Join-Path $env:OUTPUT_PATH_LISTS 'custom') -ItemType Directory -Force
          New-Item -Path $env:OUTPUT_PATH_OTHER -ItemType Directory -Force
          New-Item -Path $env:OUTPUT_PATH_JSON -ItemType Directory -Force

      - name: 📄 Update detailed runbook documents
        shell: pwsh
        run: |
          Write-Host "📝 Generating detailed runbook documents..."
          . .github/scripts/Get-RunbookDescriptions.ps1 `
              -includedScope @("device", "group", "org", "user") `
              -includePermissions `
              -includeDocs `
              -includeWhereToFind `
              -includeNotes `
              -includeParameters `
              -includeAdditionalLinks `
              -outputMode "SeparateFileSeparateFolder" `
              -nameTOCFilesAlwaysREADME `
              -outputFolder $env:OUTPUT_PATH_DOCS `
              -rootFolder $env:ROOT_PATH `
              -mainOutfile "README.md"

      - name: 📊 Update onefile runbook document
        shell: pwsh
        run: |
          Write-Host "📑 Generating single-file runbook overview..."
          . .github/scripts/Get-RunbookDescriptions.ps1 `
              -includedScope @("device", "group", "org", "user") `
              -includeDocs `
              -includeWhereToFind `
              -outputMode "OneFile" `
              -outputFolder $env:OUTPUT_PATH_OTHER `
              -rootFolder $env:ROOT_PATH `
              -mainOutfile "RealmJoin-RunbookOverview.md"

      - name: 📋 Update list-based documents
        shell: pwsh
        run: |
          Write-Host "📜 Generating runbook lists..."
          . .github/scripts/Get-RunbookList.ps1 `
              -includedScope @("device", "group", "org", "user") `
              -createRunbookOverviewList `
              -createCustomRunbookOverviewList `
              -createCompactRunbookOverviewList `
              -createPermissionList `
              -createParameterList `
              -createCustomRunbookList `
              -createAutomationAccountNameList `
              -outputFolder $env:OUTPUT_PATH_LISTS `
              -rootFolder $env:ROOT_PATH

      - name: 🔍 Update runbook detail JSON
        shell: pwsh
        run: |
          Write-Host "🧩 Generating runbook detail JSON..."
          . .github/scripts/Get-RunbookDetailJson.ps1 `
              -includedScope @("device", "group", "org", "user") `
              -outputFolder $env:OUTPUT_PATH_JSON `
              -rootFolder $env:ROOT_PATH

      - name: 🔒 Update unique permissions JSON
        shell: pwsh
        run: |
          Write-Host "🛡️ Generating unique permissions JSON..."
          . .github/scripts/Get-UniquePermissions.ps1 `
              -rootFolder $env:ROOT_PATH `
              -permissionsFolderName $env:PERMISSIONS_PATH `
              -bothPathCombinations `
              -outputFolder $env:OUTPUT_PATH_JSON `
              -OutputFileNamePrefix "AllRealmJoinRunbooks_collected_"

      - name: 🔑 Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.APP_RJ_RUNBOOK_DOCS_ID }}
          private-key: ${{ secrets.APP_RJ_RUNBOOK_DOCS_KEY }}
          repositories: realmjoin-runbooks
          permission-contents: write

      - name: 💾 Commit and push changes
        env:
          PUSH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          # Commit as the GitHub App bot, which is allowed to bypass the branch rules on master
          bot_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config --local user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git config --local user.name "${APP_SLUG}[bot]"
          git add docs/
          git add README.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update documentation"
          remote="https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # realmjoin/realmjoin-docs may have pushed docs/exports/ in the meantime
          git pull --rebase "$remote" "${GITHUB_REF_NAME}"
          git push "$remote" "HEAD:${GITHUB_REF}"
