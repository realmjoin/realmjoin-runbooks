version: 2
updates:
  # Keeps the SHA-pinned GitHub Actions in .github/workflows current (SHA and version comment together)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      action-dependencies:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 7
